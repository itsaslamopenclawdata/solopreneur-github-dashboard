<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solopreneur GitHub Command Center</title>
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <script src="assets/js/dashboard.js" defer></script>
</head>
<body>

<header class="site-header">
  <div>
    <h1>Solopreneur <span class="accent">GitHub Command Center</span></h1>
    <p class="tagline">Build → Ship → Learn → Improve</p>
  </div>
  <div class="header-meta">
    <p id="freshness">Loading dashboard data…</p>
    <p id="repo-stats"></p>
  </div>
</header>

<div id="status-banner" class="banner" role="alert" hidden></div>

<section class="filters" aria-label="Dashboard filters">
  <label class="control">
    Repositories
    <select id="f-count">
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20">20</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="all">All</option>
    </select>
  </label>
  <label class="control">
    Pushed within
    <select id="f-days">
      <option value="1">1 day</option>
      <option value="2">2 days</option>
      <option value="5">5 days</option>
      <option value="10">10 days</option>
      <option value="15">15 days</option>
      <option value="20">20 days</option>
      <option value="30">30 days</option>
      <option value="all">All time</option>
    </select>
  </label>
  <label class="control search-label">
    Search projects
    <input id="f-search" type="search" placeholder="name, purpose, topic, commit…">
  </label>
  <label class="control check">
    <input id="f-archived" type="checkbox"> Include archived
  </label>
  <label class="control check">
    <input id="f-forks" type="checkbox" checked> Include forks
  </label>
  <details id="fields-panel" class="control">
    <summary>Customize Fields</summary>
    <div id="fields-list" class="fields-list"></div>
  </details>
  <button id="csv-btn" type="button" class="btn">Download CSV</button>
  <span id="match-count" class="match-count" aria-live="polite"></span>
</section>

<main>
  <div class="table-wrap">
    <table id="repo-table">
      <thead><tr id="repo-head"></tr></thead>
      <tbody id="repo-body"></tbody>
    </table>
  </div>

  <section class="feed-section">
    <h2>Recent Development Activity</h2>
    <div id="activity-feed"></div>
  </section>
</main>

<footer>
  <p>Data refreshed by GitHub Actions every 6 hours ·
    <a href="https://github.com/itsaslamopenclawdata/solopreneur-github-dashboard">Source repo</a></p>
</footer>

</body>
</html>
